# ci-workflow.yml
name: SynapseNet CI Workflow

# Controls when the workflow will run
on:
    # Trigger the workflow on push or pull request events for the dev branch
    push:
        branches: [dev] # Changed to 'dev' branch
    pull_request:
        branches: [dev] # Changed to 'dev' branch

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    # This workflow contains a single job called "build-and-test"
    build-and-test:
        # The type of runner that the job will run on
        runs-on: ubuntu-latest

        # Steps represent a sequence of tasks that will be executed as part of the job
        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --- Node.js Setup (for JS/TS Chaincode, Backend, React Native Frontend) ---
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Consistent Node.js version
                  cache: "yarn" # Changed to 'yarn'
                  #cache-dependency-path: "yarn.lock" # <-- ADD THIS LINE

            # --- Python Setup (for AI Services, Utilities) ---
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10" # Consistent Python version (e.g., 3.10 or 3.11)
                  cache: "pip" # Cache pip dependencies
                  cache-dependency-path: "**/ai-services/*/requirements.txt"

            # --- Docker Setup (for building container images) ---
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
              # The buildx action allows for building multi-platform Docker images and other advanced features.

