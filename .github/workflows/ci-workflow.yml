# ci-workflow.yml
name: SynapseNet CI Workflow

on:
    push:
        branches: [dev] # or 'master'
    pull_request:
        branches: [dev] # or 'master'
    workflow_dispatch:

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            # --- Node.js Setup (for JS/TS Chaincode, Backend, React Native Frontend) ---
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Consistent Node.js version
                  cache: "npm" # or 'yarn', depending on your package manager choice

            # --- Python Setup (for AI Services, Utilities) ---
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10" # Consistent Python version (e.g., 3.10 or 3.11)
                  cache: "pip" # Cache pip dependencies

