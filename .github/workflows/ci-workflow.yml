name: SynapseNet CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build web application
        run: yarn web3:build

      - name: Test credential chaincode
        run: yarn chaincode:test

      - name: Test trust chaincode
        run: yarn trust:test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/identity-api/requirements.txt

      - name: Install identity API dependencies
        run: pip install -r services/identity-api/requirements.txt

      - name: Test identity API
        working-directory: services/identity-api
        run: |
          mkdir -p data
          alembic upgrade head
          pytest -q tests

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate operational scripts
        run: bash -n infrastructure/scripts/*.sh

      - name: Test Phase 4 topology renderer
        run: yarn phase4:test

      - name: Validate Phase 4 Fabric artifacts
        run: yarn phase4:validate-topology

      - name: Validate Phase 5 observability
        run: yarn phase5:validate-observability

      - name: Test Phase 6 release evidence
        run: yarn phase6:test

      - name: Validate Phase 6 load scenario
        run: yarn phase6:validate-load

      - name: Test final phase gates
        run: yarn final-phases:test
