# SynapseNet/docker-compose.yml
#
# Docker Compose configuration for a local Hyperledger Fabric network (v2.5.6).
# Configured for 'synapsenet.com' domains and uses artifacts generated by cryptogen and configtxgen.
#

version: '3.8'

# Environment variables to simplify Docker Compose
x-fabric-env: &fabric-env
  FABRIC_CFG_PATH=/etc/hyperledger/fabric # Inside the container
  CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
  CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=synapsenet_test
  # CORE_LOGGING_LEVEL=DEBUG # Uncomment for verbose logging
  # CORE_LOGGING_LEVEL=INFO # Default

x-volumes-base: &volumes-base
  # Mount Docker socket for chaincode lifecycle (peer needs to interact with Docker daemon)
  - /var/run/docker.sock:/host/var/run/docker.sock

networks:
  synapsenet_test: # Our custom network

services:
  # ---------------------------------------------------------------------------
  # Orderer Service (orderer.synapsenet.com)
  # ---------------------------------------------------------------------------
  orderer.synapsenet.com:
    container_name: orderer.synapsenet.com
    image: hyperledger/fabric-orderer:${FABRIC_VERSION}
    environment:
      - <<: *fabric-env
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/etc/hyperledger/fabric/tls/ca.crt,/etc/hyperledger/fabric/tls/tlsca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/etc/hyperledger/fabric/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/etc/hyperledger/fabric/tls/server.key
      - ORDERER_GENERAL_LOGLEVEL=INFO
      - ORDERER_FILELEDGER_LOCATION=/var/hyperledger/production/orderer
      - ORDERER_METRICS_PROVIDER=prometheus
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
      - ORDERER_OPERATIONS_TLS_ENABLED=false # Simplify for local dev, enable for prod
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./fabric-network-config/channel-artifacts/genesis.block:/etc/hyperledger/fabric/genesis.block
      - ./fabric-network-config/crypto-config/ordererOrganizations/synapsenet.com/orderers/orderer.synapsenet.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network-config/crypto-config/ordererOrganizations/synapsenet.com/orderers/orderer.synapsenet.com/tls/:/etc/hyperledger/fabric/tls
    ports:
      - "7050:7050"
      - "8443:8443"
    networks:
      - synapsenet_test

  # ---------------------------------------------------------------------------
  # Org1 Peer Service (peer0.org1.synapsenet.com)
  # ---------------------------------------------------------------------------
  peer0.org1.synapsenet.com:
    container_name: peer0.org1.synapsenet.com
    image: hyperledger/fabric-peer:${FABRIC_VERSION}
    environment:
      - <<: *fabric-env
      - CORE_PEER_ID=peer0.org1.synapsenet.com
      - CORE_PEER_ADDRESS=peer0.org1.synapsenet.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.synapsenet.com:7052 # Chaincode external listener
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052 # Chaincode internal listener
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.synapsenet.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.synapsenet.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_TLS_CLIENTAUTHREQUIRED=false # Simplify for local dev, enable for prod
      - CORE_PEER_TLS_CLIENTROOTCAS_FILES=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.org1.synapsenet.com:5984
      - CORE_METRICS_PROVIDER=prometheus
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - <<: *volumes-base
      - ./fabric-network-config/crypto-config/peerOrganizations/org1.synapsenet.com/peers/peer0.org1.synapsenet.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric-network-config/crypto-config/peerOrganizations/org1.synapsenet.com/peers/peer0.org1.synapsenet.com/tls:/etc/hyperledger/fabric/tls
      - ./fabric-network-config/peer0.org1.synapsenet.com:/var/hyperledger/production # Peer data volume
    ports:
      - "7051:7051"
      - "7052:7052" # Chaincode container port
    depends_on:
      - orderer.synapsenet.com
      - couchdb0.org1.synapsenet.com
    networks:
      - synapsenet_test

  # ---------------------------------------------------------------------------
  # Org1 CouchDB Service (for peer0's state database)
  # ---------------------------------------------------------------------------
  couchdb0.org1.synapsenet.com:
    container_name: couchdb0.org1.synapsenet.com
    image: couchdb:${THIRDPARTY_VERSION}
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    volumes:
      - ./fabric-network-config/couchdb0.org1.synapsenet.com:/opt/couchdb/data
    ports:
      - "5984:5984"
    networks:
      - synapsenet_test

  # ---------------------------------------------------------------------------
  # CLI Service (for interacting with the network)
  # ---------------------------------------------------------------------------
  cli:
    container_name: cli
    image: hyperledger/fabric-tools:${FABRIC_VERSION}
    tty: true
    stdin_open: true
    environment:
      - <<: *fabric-env
      - GOPATH=/opt/gopath
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.synapsenet.com/users/Admin@org1.synapsenet.com/msp
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.synapsenet.com/peers/peer0.org1.synapsenet.com/tls/ca.crt
      - CORE_PEER_ADDRESS=peer0.org1.synapsenet.com:7051
      - ORDERER_TLS_ROOTCERT=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/ordererOrganizations/synapsenet.com/orderers/orderer.synapsenet.com/tls/ca.crt
      - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_VERSION=${FABRIC_VERSION}
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash # Keeps the container running for interactive use
    volumes:
      - ./fabric-network-config/crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ./fabric-network-config/channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../chaincode:/opt/gopath/src/github.com/chaincode # Mount our monorepo's chaincode directory
    networks:
      - synapsenet_test
    depends_on:
      - orderer.synapsenet.com
      - peer0.org1.synapsenet.com